<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TD Mobile Console</title>
    <style>
        body { 
            margin: 0; padding: 0; background: #111; 
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start; 
            min-height: 100vh; font-family: sans-serif; overflow: hidden;
        }
        
        /* Botones adaptados para dedos en pantallas táctiles */
        #consola { 
            display: flex; width: 90%; gap: 8px; margin: 15px 0; 
            background: #222; padding: 8px; border-radius: 8px; border: 1px solid #333; 
        }

        button { 
            flex: 1; background: #333; color: #00ffcc; border: 1px solid #00ffcc; 
            padding: 12px 5px; cursor: pointer; border-radius: 6px; 
            font-weight: bold; font-size: 11px; text-transform: uppercase;
        }

        button.activo { 
            background: #00ffcc; color: #111; box-shadow: 0 0 10px rgba(0,255,204,0.5); 
        }
        
        /* Contenedor responsivo para el lienzo del efecto */
        #contenedor-canvas {
            width: 95%; max-width: 500px; display: flex; justify-content: center;
        }

        canvas { 
            width: 100%; height: auto; background: #000; 
            border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        #mensaje { 
            position: absolute; top: 40%; color: #00ffcc; text-align: center; 
            font-size: 15px; background: rgba(0,0,0,0.85); padding: 15px; 
            border-radius: 8px; border: 1px solid #00ffcc; width: 70%; max-width: 300px;
        }
    </style>
</head>
<body>

    <div id="consola">
        <button id="btn-normal" class="activo" onclick="cambiarModo('normal')">Normal</button>
        <button id="btn-efecto" onclick="cambiarModo('efecto')">Efecto</button>
        <button id="btn-objetos" onclick="cambiarModo('objetos')">Escáner</button>
    </div>

    <div id="mensaje">Iniciando cámara del dispositivo...</div>
    
    <div id="contenedor-canvas">
        <canvas id="lienzo"></canvas>
    </div>

    <script src="app.js"></script>
</body>
</html>
